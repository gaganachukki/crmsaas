<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stackly - 404 Page Not Found</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="stylesheet" href="CSS/404.css">
</head>
<body class="page-404">
    <main class="error-wrapper">
        <div class="error-content text-center">
            
            <div class="error-visuals">
                <div class="error-code">404</div>
                <img src="https://illustrations.popsy.co/amber/page-not-found.svg" alt="Confused character 404" class="error-illustration">
            </div>

            <h2 class="error-message">
                THE PAGE YOU'RE LOOKING<br>
                <strong>FOR DOESN'T EXIST.</strong>
            </h2>

            <a href="index.html" class="btn btn-dark btn-home">Go Back to Homepage</a>
            
        </div>
    </main>
</body>
</html>
